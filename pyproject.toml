[tool.poetry]
name = "spurchart"
version = "0.0.28"
description = "Spur charts for super-heterodyne mixers, DACs, and ADCs"
authors = ["Justin Magers <magers@ieee.org>"]

[tool.poetry.dependencies]
python = "^3.14"
pandas = "^3.0.6"
scipy = "^1.18.1"
matplotlib = "^3.11.2"
scikit-rf = "^2.2.0"
colorcet = "^3.2.1"
bokeh = "^3.10.1"
textalloc = "^1.2.4"

[tool.poetry.group.dev.dependencies]
ipykernel = "^7.4.0"

[tool.poetry.group.doc.dependencies]
# need to update versions in this section
schemdraw = {extras = ["matplotlib", "svgmath"], version = "^0.16"}
mkdocs-material = "^9.1.14"
mkdocstrings = {extras = ["python"], version = "^0.21.2"}
mkdocs-gen-files = "^0.5.0"
mkdocs-literate-nav = "^0.6.0"
mkdocs-section-index = "^0.3.5"

[tool.poetry.group.test.dependencies]
pytest = "^9.1.1"

[tool.black]
line-length = 100

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
